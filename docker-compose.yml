services:
  db:
    image: postgres:15-alpine
    container_name: audio-app-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=audio_db
    ports:
      - "5432:5432"
    networks:
      - neuro-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web-api:
    build:
      context: ./apps/neuro-chord-prod-backend
      dockerfile: Dockerfile
    container_name: audio-app-backend
    networks:
      - neuro-net
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./apps/neuro-chord-frontend
      dockerfile: Dockerfile
    container_name: audio-app-frontend
    networks:
      - neuro-net
    depends_on:
      - web-api
    environment:
      - INTERNAL_API_URL=http://web-api:8080

  mailpit:
    image: axllent/mailpit:latest
    container_name: audio-app-mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - neuro-net
    environment:
      - MP_MAX_MESSAGES=500

  redis:
    image: redis:7-alpine
    container_name: audio-app-redis
    restart: always
    networks:
      - neuro-net
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1", "--loglevel", "warning"]

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: audio-app-prometheus
    restart: always
    networks:
      - neuro-net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: audio-app-grafana
    restart: always
    networks:
      - neuro-net
    ports:
      - "8000:3000"

  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - neuro-net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - web-api

networks:
  neuro-net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
